{% extends "base.html" %}

{% block title %}{{ titulo }} · FYAG{% endblock %}

{% block extra_head %}
  <style>
    .egreso-formulario { width: min(100%, 560px); }
    .egreso-formulario :is(input, select, textarea) { width: 100%; }
    .egreso-acciones { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    .egreso-acciones button:disabled { background: #e2e8f0; color: #475569; cursor: default; }
  </style>
{% endblock %}

{% block content %}
  <h1>{{ titulo }}</h1>
  <form method="post" class="egreso-formulario" id="form-egreso">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="egreso-acciones">
      <button type="submit">Confirmar egreso</button>
      <a class="boton boton-secundario" href="{% url 'bodega_web' %}">Volver a bodega</a>
    </div>
  </form>
{% endblock %}

{% block extra_js %}
  <script>
    const formularioEgreso = document.getElementById("form-egreso");
    const justificacion = formularioEgreso.elements.justificacion;
    const botonConfirmar = formularioEgreso.querySelector('button[type="submit"]');
    function validarMotivo() {
      botonConfirmar.disabled = justificacion.value.trim() === "";
    }
    justificacion.addEventListener("input", validarMotivo);
    validarMotivo();
  </script>
{% endblock %}
