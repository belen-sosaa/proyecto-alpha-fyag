{% extends "base.html" %}
{% block title %}Registrar factura{% endblock %}
{% block content %}
  <h1>Registrar factura de compra</h1>
  <form method="post">
    {% csrf_token %}
    {{ formulario.as_p }}
    <button type="submit">Registrar factura</button>
    <a class="boton boton-secundario" href="{% url 'compras' %}">Volver a compras</a>
  </form>
{% endblock %}
