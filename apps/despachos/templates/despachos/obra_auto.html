<div data-obra-autocomplete
     data-url="{% url 'obras_buscar' %}">

  <label for="obra-destino" class="block text-sm font-bold text-slate-600 mb-1.5">Obra de destino</label>
  <input
    id="obra-destino"
    type="text"
    data-obra-texto
    placeholder="Escribe al menos 3 letras"
    autocomplete="off"
    aria-describedby="obra-mensaje"
    class="w-full border border-slate-200 rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-blue-500"
    required
  >

  <input type="hidden" name="obra" data-obra-id>

  <ul data-obra-resultados class="mt-2 divide-y rounded-xl border border-slate-200 bg-white shadow-sm" hidden></ul>
  <p id="obra-mensaje" data-obra-mensaje role="status" class="mt-1 text-sm text-slate-600"></p>
</div>
