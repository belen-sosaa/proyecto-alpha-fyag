version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_fyag
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password_seguro
      POSTGRES_DB: gestion_fyag_db
    ports:
      - "5432:5432"
    volumes:
      # Carga el archivo sql al iniciar por primera vez
      - ./init-scripts:/docker-entrypoint-initdb.d
      # Almacena los datos y cambios futuros de forma permanente
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: