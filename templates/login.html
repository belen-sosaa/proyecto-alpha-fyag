<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso - ERP Sistema Logístico</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos FontAwesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      /* Fondo iluminado */
      .bg-aurora {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background-color: #020617; /* Fondo oscuro */
        overflow: hidden;
        pointer-events: none;
      }

      .blob {
        position: absolute;
        filter: blur(90px);
        border-radius: 50%;
        opacity: 0.6;
        animation: movimientoFluido 8s infinite alternate
          cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Luz azul */
      .blob-1 {
        top: -10%;
        left: -10%;
        width: 50vw;
        height: 50vw;
        background-color: #2563eb;
        animation-duration: 12s;
      }

      /* Luz celeste */
      .blob-2 {
        bottom: -20%;
        right: -10%;
        width: 60vw;
        height: 60vw;
        background-color: #0ea5e9;
        animation-duration: 15s;
        animation-direction: alternate-reverse;
      }

      /* Luz índigo */
      .blob-3 {
        top: 20%;
        left: 30%;
        width: 40vw;
        height: 40vw;
        background-color: #4f46e5;
        animation-duration: 10s;
        animation-delay: -2s;
      }

      /* Destello */
      .blob-4 {
        top: 15%;
        left: 20%;
        width: 60vw;
        height: 60vw;
        background-color: #ffffff;
        opacity: 0;
        filter: blur(120px);
        animation: relampago 8s infinite;
      }

      @keyframes movimientoFluido {
        0% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(15%, 20%) scale(1.15);
        }
        100% {
          transform: translate(-10%, 15%) scale(0.9);
        }
      }

      /* Destellos */
      @keyframes relampago {
        0%,
        90%,
        100% {
          opacity: 0;
          transform: scale(1);
        }
        92% {
          opacity: 0.15;
          transform: scale(1.05);
        }
        94% {
          opacity: 0;
        }
        95% {
          opacity: 0.25;
          transform: scale(1.1);
        }
        97% {
          opacity: 0;
        }
      }

      /* Tarjeta translúcida */
      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>

  <body
    class="min-h-screen w-full flex items-center justify-center font-sans relative m-0 py-6 px-2"
  >
    <!-- Fondo iluminado -->
    <div class="bg-aurora">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
    </div>

    <!-- Acceso -->
    <div
      class="glass-card p-6 sm:p-10 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] w-full max-w-md z-10 mx-4 relative"
    >
      <div class="text-center mb-8">
        <div
          class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl shadow-[0_10px_20px_rgba(37,99,235,0.4)] mb-4 transition transform hover:scale-105"
        >
          <i class="fas fa-boxes"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">
          Logística FYAG
        </h1>
        <p class="text-slate-500 text-sm mt-1">
          Ingrese sus credenciales operativas
        </p>
      </div>

      <form id="form-login" class="space-y-5">
        <div>
          <label class="block text-slate-700 font-bold mb-2 text-sm"
            >Correo del Trabajador</label
          >
          <div class="relative">
            <div
              class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
            >
              <i class="fas fa-envelope text-slate-400"></i>
            </div>
            <input
              type="email"
              id="email"
              class="w-full border border-slate-200 pl-10 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50 text-slate-700 transition"
              placeholder="ejemplo@fyag.cl"
              required
            />
          </div>
        </div>

        <div>
          <label class="block text-slate-700 font-bold mb-2 text-sm"
            >Contraseña</label
          >
          <div class="relative">
            <div
              class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
            >
              <i class="fas fa-lock text-slate-400"></i>
            </div>
            <input
              type="password"
              id="password"
              class="w-full border border-slate-200 pl-10 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50 text-slate-700 transition"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        <!-- Mensaje de error -->
        <div class="h-8 flex items-center justify-center">
          <p
            id="error-msg"
            class="text-red-500 text-sm hidden font-bold text-center bg-red-50 w-full py-1.5 rounded-lg border border-red-100 shadow-sm"
          >
            <i class="fas fa-exclamation-triangle mr-1"></i> Credenciales
            incorrectas
          </p>
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-[0_8px_15px_rgba(37,99,235,0.2)] hover:shadow-[0_12px_20px_rgba(37,99,235,0.3)]"
        >
          Entrar al Sistema
        </button>

        <fieldset class="pt-2">
          <legend class="block text-slate-700 font-bold mb-3 text-sm">
            ¿A qué versión quieres ingresar?
          </legend>
          <div class="grid grid-cols-2 gap-3">
            <label
              class="flex items-center gap-2 p-3 rounded-xl border border-slate-200 bg-white cursor-pointer hover:border-blue-500 has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50"
            >
              <input
                type="radio"
                name="destino"
                value="{% url 'bodega_web' %}"
                checked
                class="accent-blue-600"
              />
              <span>
                <span class="block font-bold text-slate-800">Web</span>
                <span class="block text-xs text-slate-500">Bodega</span>
              </span>
            </label>
            <label
              class="flex items-center gap-2 p-3 rounded-xl border border-slate-200 bg-white cursor-pointer hover:border-blue-500 has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50"
            >
              <input
                type="radio"
                name="destino"
                value="{% url 'bodega_mobile' %}"
                class="accent-blue-600"
              />
              <span>
                <span class="block font-bold text-slate-800">Mobile</span>
                <span class="block text-xs text-slate-500">Celular/tablet</span>
              </span>
            </label>
          </div>
        </fieldset>
      </form>

      <div
        id="login-help"
        class="mt-8 pt-6 border-t border-slate-100 text-center text-xs text-slate-400"
      >
        <p>
          Para probar usa:
          <span class="font-bold text-slate-600">admin@fyag.cl</span> /
          <span class="font-bold text-slate-600">123456</span>
        </p>
      </div>
    </div>

    <script>
      document
        .getElementById("form-login")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const pass = document.getElementById("password").value;
          const destino = document.querySelector(
            'input[name="destino"]:checked',
          ).value;

          if (email === "admin@fyag.cl" && pass === "123456") {
            localStorage.setItem("sesion_fyag", "activa");
            localStorage.setItem("usuario_nombre", "Israel Ortega");
            window.location.href = destino;
          } else {
            document.getElementById("error-msg").classList.remove("hidden");
          }
        });
    </script>
  </body>
</html>
